<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Habit Tracker</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:30px;
}

.card{
    width:500px;
    background:#1b1b1b;
    border-radius:15px;
    padding:20px;
}

h2{
    margin-top:0;
    color:#f6b400;
}

.grid{
    display:grid;
    grid-template-columns:repeat(20,20px);
    gap:5px;
    margin:20px 0;
}

.day{
    width:20px;
    height:20px;
    background:#2d2d2d;
    border-radius:4px;
}

.done{
    background:#f6b400;
}

.stats{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
    text-align:center;
}

.stat-value{
    font-size:32px;
    color:#fff;
}

.stat-title{
    color:#aaa;
}
</style>
</head>

<body>

<div class="card">
    <h2>morning-push-up</h2>

    <div class="grid">
        <div class="day done"></div>
        <div class="day done"></div>
        <div class="day"></div>
        <div class="day"></div>
        <div class="day done"></div>
        <div class="day"></div>
        <div class="day"></div>
        <div class="day done"></div>
        <div class="day"></div>
        <div class="day"></div>

        <div class="day"></div>
        <div class="day done"></div>
        <div class="day"></div>
        <div class="day"></div>
        <div class="day"></div>
        <div class="day done"></div>
        <div class="day"></div>
        <div class="day"></div>
        <div class="day"></div>
        <div class="day done"></div>
    </div>

    <div class="stats">
        <div>
            <div class="stat-title">Goal</div>
            <div class="stat-value">10</div>
        </div>

        <div>
            <div class="stat-title">Days</div>
            <div class="stat-value">66</div>
        </div>

        <div>
            <div class="stat-title">Records</div>
            <div class="stat-value">18</div>
        </div>
    </div>
</div>

</body>
</html>
