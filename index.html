<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>
    <style>
      body {
        background: #111;
        color: white;
        font-family: tahoma;
        text-align: center;
        padding: 20px;
      }

      #tracker {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: 700px;
        margin: auto;
      }

      .day {
        width: 30px;
        height: 30px;
        background: #333;
        border-radius: 5px;
        cursor: pointer;
      }
      #streakBox {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 20px auto;
        max-width: 700px;
      }

      .green {
        width: 30px;
        height: 30px;
        background: #00aa44;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h2 id="startDate"></h2>
    <h3 id="daysCount"></h3>

    <div id="tracker"></div>

    <button onclick="resetTracker()">پاک کردن همه اطلاعات</button>

    <h2>Streak Tracker</h2>

    <h3 id="streakDays"></h3>

    <button onclick="resetStreak()">ریست</button>

    <div id="streakBox"></div>

    <script>
    const client = window.supabase.createClient(
  "https://kpzeucewcljedueqkwia.supabase.co",
  "sb_publishable_q0sLKZrFQn85wMcjL38aSA_hTnbFL61"
);
      
      const colors = {
        0: "#333",
        1: "#fff9c4",
        2: "#fff176",
        3: "#ffd54f",
        4: "#ffc107",
        5: "#ff9800",
      };

      function getJalaliToday() {
        const d = new Date();
        const j = jalaali.toJalaali(
          d.getFullYear(),
          d.getMonth() + 1,
          d.getDate(),
        );
        return `${j.jy}/${j.jm}/${j.jd}`;
      }

      async function loadTracker() {
        let { data, error } = await client.from("tracker").select("*");

        if (error) {
          console.log(error);
          return;
        }

        if (!data || data.length === 0) {
          await client.from("tracker").insert({
            day: getJalaliToday(),
            color: 0,
          });

          data = [
            {
              day: getJalaliToday(),
              color: 0,
            },
          ];
        }

        document.getElementById("startDate").innerText =
          "تاریخ شروع: " + data[0].day;

        document.getElementById("daysCount").innerText =
          "تعداد روزها: " + data.length;

        let box = document.getElementById("tracker");
        box.innerHTML = "";

        data.forEach((item) => {
          let d = document.createElement("div");

          d.className = "day";
          d.style.background = colors[item.color];

          if (item.day === getJalaliToday()) {
            d.onclick = async () => {
              let n = Number(prompt("نمره امروز 1 تا 5"));

              if (n >= 1 && n <= 5) {
               let {error} = await client
.from("tracker")
.update({
  color: n,
})
.eq("day", item.day);

console.log(error);

if(!error){
  d.style.background = colors[n];
}

                d.style.background = colors[n];
              }
            };
          }

          box.appendChild(d);
        });
      }

      async function resetTracker() {
        if (confirm("همه اطلاعات پاک شود؟")) {
          await client.from("tracker").delete().neq("day", "");

          location.reload();
        }
      }

      loadTracker();

      // streak

      let streak = JSON.parse(localStorage.getItem("streak")) || {
        start: new Date().toISOString().split("T")[0],
        resets: 0,
      };

      function drawStreak() {
        let box = document.getElementById("streakBox");
        box.innerHTML = "";

        let start = new Date(streak.start);
        let now = new Date();

        let days = Math.floor((now - start) / 86400000) + 1;

        document.getElementById("streakDays").innerHTML =
          "روزهای فعلی: " + days + " | تعداد ریست: " + streak.resets;

        for (let i = 0; i < days; i++) {
          let d = document.createElement("div");
          d.className = "green";
          box.appendChild(d);
        }
      }

      function resetStreak() {
        if (!streak) return;

        if (confirm("ریست شود؟")) {
          streak.start = new Date().toISOString().split("T")[0];
          streak.resets++;

          localStorage.setItem("streak", JSON.stringify(streak));

          drawStreak();
        }
      }

      drawStreak();
    </script>
  </body>
</html>
