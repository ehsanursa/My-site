<div id="tracker"></div>

<style>
#tracker{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}
.day{
    width:25px;
    height:25px;
    background:#333;
    border-radius:4px;
    cursor:pointer;
}
</style>

<script>
const tracker = document.getElementById("tracker");

function today(){
    return new Date().toISOString().split("T")[0];
}

let data = JSON.parse(localStorage.getItem("habit")) || {};

if(!data[today()]){
    data[today()] = "#333333";
}

function save(){
    localStorage.setItem("habit", JSON.stringify(data));
}

function render(){
    tracker.innerHTML = "";

    Object.keys(data).sort().forEach(date => {
        const box = document.createElement("div");
        box.className = "day";
        box.style.background = data[date];

        box.onclick = () => {
            const color = prompt(
                "Color:",
                data[date]
            );

            if(color){
                data[date] = color;
                save();
                render();
            }
        };

        tracker.appendChild(box);
    });
}

save();
render();
</script>
