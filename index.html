<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>

<style>

body{
    background:#111;
    color:white;
    font-family:tahoma;
    text-align:center;
    padding:20px;
}

#tracker{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    max-width:700px;
    margin:auto;
}

.day{
    width:30px;
    height:30px;
    background:#333;
    border-radius:5px;
    cursor:pointer;
}

</style>
</head>
<body>

<h2 id="startDate"></h2>
<h3 id="daysCount"></h3>

<div id="tracker"></div>

<button onclick="resetTracker()">
پاک کردن همه اطلاعات</button>
    
<script>

function getJalaliToday(){

    const d = new Date();

    const j = jalaali.toJalaali(
        d.getFullYear(),
        d.getMonth()+1,
        d.getDate()
    );

    return `${j.jy}/${j.jm}/${j.jd}`;
}


const colors = {
    0:"#333",
    1:"#fff9c4",
    2:"#fff176",
    3:"#ffd54f",
    4:"#ffc107",
    5:"#ff9800"
};


let data = JSON.parse(
    localStorage.getItem("habitTracker")
);

if(!data){

    data = {
        start:getJalaliToday(),
        dates:[getJalaliToday()],
        scores:{}
    };

    localStorage.setItem(
        "habitTracker",
        JSON.stringify(data)
    );
}


const today = getJalaliToday();

const lastDate =
data.dates[data.dates.length-1];


if(lastDate !== today){

    data.dates.push(today);

    localStorage.setItem(
        "habitTracker",
        JSON.stringify(data)
    );
}


document.getElementById("startDate")
.innerText =
"تاریخ شروع: " + data.start;


document.getElementById("daysCount")
.innerText =
"تعداد روزها: " + data.dates.length;


const tracker =
document.getElementById("tracker");


data.dates.forEach(date=>{

    const box =
    document.createElement("div");

    box.className="day";

    const score =
    data.scores[date] || 0;

    box.style.background =
    colors[score];


    if(date === today){

        box.onclick = ()=>{

            let n = prompt(
                "نمره امروز (1 تا 5)"
            );

            n = Number(n);

            if(n>=1 && n<=5){

                data.scores[date]=n;

                localStorage.setItem(
                    "habitTracker",
                    JSON.stringify(data)
                );

                box.style.background =
                colors[n];
            }

        };

    }

    tracker.appendChild(box);

});

    function resetTracker(){

    if(confirm("همه اطلاعات پاک شود؟")){

        localStorage.removeItem(
            "habitTracker"
        );

        location.reload();

    }

}
</script>

</body>
</html>
