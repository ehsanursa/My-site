<!DOCTYPE html>

<html lang="fa">
<head>

<meta charset="UTF-8">

<title>Habit Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>


<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}


#box{

display:flex;
flex-wrap:wrap;
gap:6px;
margin:30px auto;
max-width:700px;

}


.square{

width:30px;
height:30px;
background:#333;
border-radius:5px;
cursor:pointer;

}


button{

padding:10px 20px;
border:0;
border-radius:10px;
cursor:pointer;

}


</style>


</head>


<body>


<h1>Habit Tracker</h1>


<h3 id="start"></h3>

<h3 id="count"></h3>


<div id="box"></div>


<button onclick="clearData()">
پاک کردن
</button>




<script>


const box=document.getElementById("box");

const startText=document.getElementById("start");

const countText=document.getElementById("count");




let data=JSON.parse(
localStorage.getItem("habit")
)
||
{

start:getJDate(),

days:{}

};




let colors={

1:"#fff9c4",

2:"#fff176",

3:"#ffd54f",

4:"#ffc107",

5:"#ff9800"

};





function getJDate(){


let d=new Date();


let j=jalaali.toJalaali(

d.getFullYear(),

d.getMonth()+1,

d.getDate()

);


return `${j.jy}-${j.jm}-${j.jd}`;


}





function save(){


localStorage.setItem(
"habit",
JSON.stringify(data)
);


}





function draw(){


box.innerHTML="";



let totalDays =
Math.max(
1,
Math.floor(
(new Date()-new Date(data.start))/86400000
)+1
);



for(let i=0;i<totalDays;i++){



let sq=document.createElement("div");


sq.className="square";



if(data.days[i]){

sq.style.background=
colors[data.days[i]];

}



if(i==totalDays-1){


sq.onclick=function(){



let score=prompt(
"نمره امروز (1 تا 5)"
);



if(score>=1 && score<=5){


data.days[i]=score;


save();


draw();


}


};


}



box.appendChild(sq);


}



startText.innerHTML=
"شروع: "+data.start;


countText.innerHTML=
"روز: "+totalDays;


}





function clearData(){


localStorage.removeItem("habit");


location.reload();


}





draw();



</script>


</body>
</html>
